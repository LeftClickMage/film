        <style>
            @keyframes invisFade {
                0%{
                    opacity:1;
                    scale: 1;
                }
                80%{
                    opacity:0;
                }
                100%{
                    opacity:0;
                    scale:1.06;
                }
            }
            @keyframes visFade {
                0%{
                    opacity:0;
                    scale: 1.06;
                }
                80%{
                    opacity:1;
                }
                100%{
                    opacity:1;
                    scale:1;
                }
            }
            body{
                background-color: rgb(84, 98, 45);
            }
            .invisFade {
                animation: invisFade 700ms ease forwards;
            }
            .visFade {
                animation: visFade 700ms ease forwards;
            }
        </style>

    <script>

        function createOverallDiv(title, delay, sectionVideos){
            var overallDiv = document.createElement("div");
            overallDiv.classList.add("container", "my-5");
            document.body.appendChild(overallDiv);
            overallDiv.appendChild(createTitle(title, delay, sectionVideos));
            return overallDiv;
        }

        function createTitle(title, delay, sectionVideos){
            var container = document.createElement("div");
            container.classList.add("slide", "slide-in-bottomTitle-" + delay, "border-bottom", "border-3", "mb-4", "d-flex", "justify-content-between", "align-items-end");
            var titleParagraph = document.createElement("p");
            titleParagraph.innerHTML = title;
            titleParagraph.classList.add("h1", "text-light", "mb-0");
            container.appendChild(titleParagraph);

            var muteButton = document.createElement("button");
            muteButton.classList.add("btn", "btn-outline-light", "btn-sm", "mb-2");
            muteButton.innerHTML = "UNMUTE";
            var muted = true;
            muteButton.onclick = () => {
                muted = !muted;
                sectionVideos.forEach(v => { v.muted = muted; });
                muteButton.innerHTML = muted ? "UNMUTE" : "MUTE";
            };
            container.appendChild(muteButton);

            return container;
        }

        function createRow(padding = 4){
            var overallRow = document.createElement("div");
            overallRow.classList.add("row", "g-" + padding, "mb-4");
            return overallRow;
        }

        function createColumn(delay){
            var column = document.createElement("div");
            column.classList.add("slide", "slide-in-bottom-" + delay, "col-xl-3", "col-sm-6");
            return column;
        }

        var THUMB_WORKER_URL = "https://ig-thumb.leftclickmage.workers.dev";

        function formatCount(n){
            if(n == null) return "";
            if(n >= 1000000) return (n/1000000).toFixed(1).replace(/\.0$/, "") + "M";
            if(n >= 1000) return (n/1000).toFixed(1).replace(/\.0$/, "") + "K";
            return String(n);
        }

        function loadReelData(linkPath, imgElement, likesElement, commentsElement){
            fetch(THUMB_WORKER_URL + "?url=" + encodeURIComponent(linkPath))
                .then(r => r.json())
                .then(data => {
                    if(data.image) imgElement.src = data.image;
                    if(data.likes != null) likesElement.innerHTML = "♥ " + formatCount(data.likes);
                    if(data.comments != null) commentsElement.innerHTML = "💬 " + formatCount(data.comments);
                })
                .catch(() => {});
        }

        function createCountOverlay(position){
            var el = document.createElement("div");
            el.style.position = "absolute";
            el.style.bottom = "8px";
            el.style[position] = "8px";
            el.style.color = "white";
            el.style.fontWeight = "bold";
            el.style.fontSize = "1rem";
            el.style.textShadow = "0 1px 3px rgba(0,0,0,0.8)";
            el.style.zIndex = "2";
            el.style.pointerEvents = "none";
            return el;
        }

        function createVideo(videoPath, linkPath, sectionVideos){
            var videoContainer = document.createElement("div");
            videoContainer.classList.add("position-relative", "rounded");
            videoContainer.style.overflow = "hidden";
            videoContainer.style.aspectRatio = "9 / 16";
            videoContainer.style.width = "100%";

            var thumbnail = document.createElement("img");
            thumbnail.referrerPolicy = "no-referrer";
            thumbnail.style.position = "absolute";
            thumbnail.style.top = "0";
            thumbnail.style.left = "0";
            thumbnail.style.width = "100%";
            thumbnail.style.height = "100%";
            thumbnail.style.objectFit = "cover";

            var likesOverlay = createCountOverlay("left");
            var commentsOverlay = createCountOverlay("right");
            loadReelData(linkPath, thumbnail, likesOverlay, commentsOverlay);

            var video = document.createElement("video");
            video.muted = true;
            video.playsInline = true;
            video.loop = true;
            video.style.display = "block";
            video.style.position = "absolute";
            video.style.top = "0";
            video.style.left = "0";
            video.style.width = "100%";
            video.style.height = "100%";
            video.style.objectFit = "cover";
            video.style.zIndex = -1;
            video.preload = "auto";

            thumbnail.style.transition = "filter 300ms ease, transform 300ms ease";
            thumbnail.style.filter = "blur(8px)";
            thumbnail.style.transform = "scale(1.1)";
            
            function onVideoReady(){
                console.log("video ready, removing blur", videoPath);
                thumbnail.style.filter = "none";
                thumbnail.style.transform = "scale(1)";
            }
            video.addEventListener('canplaythrough', onVideoReady, { once: true });

            var videoSource = document.createElement("source");
            videoSource.src = "/public/videos/" + videoPath;

            var watchButton = document.createElement("button");
            watchButton.style.position = "absolute";
            watchButton.style.top = "90%";
            watchButton.style.left = "50%";
            watchButton.classList.add("slide-in-bottom-center-reverse", "btn", "btn-dark", "border", "border-1", "border-light");
            watchButton.onclick = () => {
                window.open(linkPath);
            } 
            watchButton.innerHTML = "Watch Now";

            video.appendChild(videoSource);
            if(sectionVideos) sectionVideos.push(video);
            videoContainer.appendChild(thumbnail);
            videoContainer.appendChild(video);
            videoContainer.appendChild(watchButton);
            videoContainer.appendChild(likesOverlay);
            videoContainer.appendChild(commentsOverlay);
            videoContainer.addEventListener('mouseenter', ()=>{
                video.play();
                thumbnail.classList.remove("visFade");
                thumbnail.classList.add("invisFade");
                watchButton.classList.remove("slide-in-bottom-center-reverse");
                watchButton.classList.add("slide-in-bottom-center");
            });
            videoContainer.addEventListener('mouseleave', async ()=>{
                
                thumbnail.classList.remove("invisFade");
                thumbnail.classList.add("visFade");
                video.pause();
                watchButton.classList.remove("slide-in-bottom-center");
                watchButton.classList.add("slide-in-bottom-center-reverse");
            
            });

            return videoContainer;
        }

        var delayCounter = 1;
        function createSection({"Name": name, "Videos": videosArray}){
            var delay = delayCounter * 250;
            delayCounter++;
            var sectionVideos = [];
            var testDiv = createOverallDiv(name, delay, sectionVideos);

            for (var a = 0; a < videosArray.length; a += 4) {
                var row = createRow();
                for (var i = 0; i < 4 && a + i < videosArray.length; i++) {
                    var v = videosArray[a + i];
                    var column = createColumn(delay + (i + a) * 100);
                    column.appendChild(createVideo(v["videoPath"], v["link"], sectionVideos));
                    row.appendChild(column);
                }
                testDiv.appendChild(row);
            }
        }

        createWebsiteTitle("VERTICAL CONTENT");

    </script>
